# bootc-image-builder config for the bare-metal/VM installer ISO.
#
# COSMIC ships its own first-boot wizard, cosmic-initial-setup (packaged for
# Fedora: https://packages.fedoraproject.org/pkgs/cosmic-initial-setup/), the
# COSMIC equivalent of gnome-initial-setup. In practice it doesn't reliably
# launch on first boot, so we let Anaconda handle user/network/timezone setup
# during install instead of relying on it.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/corruptedbit/fedora-dev-cosmic:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

# Subscription-manager is RHEL-only, not applicable to Fedora.
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
